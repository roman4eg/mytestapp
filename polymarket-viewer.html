<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Polymarket - Переглядач подій та ставок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls label {
            font-weight: 600;
            color: #555;
        }

        .controls select,
        .controls input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .controls select:focus,
        .controls input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .event-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f0f0f0;
        }

        .event-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .event-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-label {
            color: #999;
        }

        .meta-value {
            font-weight: 600;
            color: #667eea;
        }

        .market-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .market-count {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .markets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .market-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .market-question {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .market-outcomes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .outcome {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: #f0f0f0;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .outcome-name {
            color: #666;
        }

        .outcome-price {
            font-weight: 600;
            color: #667eea;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-closed {
            background: #f8d7da;
            color: #721c24;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .no-events {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .no-events-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: white;
            max-width: 800px;
            margin: 40px auto;
            border-radius: 15px;
            padding: 30px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* Стилі для коефіцієнтів та цін */
        .price-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .price-bar {
            flex: 1;
            height: 24px;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .price-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .price-percentage {
            color: white;
            font-weight: 600;
            font-size: 0.85em;
        }

        .price-value {
            min-width: 60px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }

        /* Стилі для стакану цін (order book) */
        .orderbook-container {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .orderbook-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .orderbook {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .orderbook-side {
            border-radius: 8px;
            overflow: hidden;
        }

        .orderbook-side-title {
            padding: 8px 12px;
            font-weight: 600;
            font-size: 0.9em;
            text-align: center;
        }

        .orderbook-bids .orderbook-side-title {
            background: #d4edda;
            color: #155724;
        }

        .orderbook-asks .orderbook-side-title {
            background: #f8d7da;
            color: #721c24;
        }

        .orderbook-rows {
            font-size: 0.85em;
        }

        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 6px 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .orderbook-row:last-child {
            border-bottom: none;
        }

        .orderbook-price {
            font-weight: 600;
        }

        .orderbook-bids .orderbook-price {
            color: #28a745;
        }

        .orderbook-asks .orderbook-price {
            color: #dc3545;
        }

        .orderbook-size {
            text-align: right;
            color: #666;
        }

        .orderbook-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 6px 12px;
            background: #f8f9fa;
            font-weight: 600;
            font-size: 0.8em;
            color: #666;
        }

        .orderbook-header-size {
            text-align: right;
        }

        .liquidity-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .liquidity-high {
            background: #d4edda;
            color: #155724;
        }

        .liquidity-medium {
            background: #fff3cd;
            color: #856404;
        }

        .liquidity-low {
            background: #f8d7da;
            color: #721c24;
        }

        .loading-prices {
            text-align: center;
            padding: 15px;
            color: #999;
            font-size: 0.9em;
        }

        .price-error {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .orderbook {
                grid-template-columns: 1fr;
            }

            .price-indicator {
                flex-direction: column;
                align-items: stretch;
            }

            .price-value {
                text-align: left;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Polymarket Event Viewer</h1>
            <p class="subtitle">Перегляд доступних подій та ставок на платформі Polymarket</p>
        </header>

        <div class="controls">
            <label>
                Статус:
                <select id="statusFilter" onchange="applyFiltersAndSort()">
                    <option value="active">Активні</option>
                    <option value="all">Всі</option>
                    <option value="closed">Закриті</option>
                </select>
            </label>

            <label>
                Сортування:
                <select id="sortOrder" onchange="applyFiltersAndSort()">
                    <option value="desc">Найновіші</option>
                    <option value="asc">Найстаріші</option>
                </select>
            </label>

            <label>
                Подій на сторінці:
                <select id="limitSelect" onchange="applyFiltersAndSort()">
                    <option value="12">12</option>
                    <option value="24">24</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                </select>
            </label>

            <button id="loadBtn" onclick="loadEvents()">Завантажити події</button>
            <button id="refreshBtn" onclick="refreshEvents()">Оновити</button>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalEvents">0</div>
                <div class="stat-label">Всього подій</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="filteredEvents">0</div>
                <div class="stat-label">Показано</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeEvents">0</div>
                <div class="stat-label">Активні події</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalMarkets">0</div>
                <div class="stat-label">Всього ринків</div>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Завантаження подій...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="eventsContainer" class="events-grid"></div>

        <div id="pagination" class="pagination" style="display: none;">
            <button onclick="previousPage()" id="prevBtn">Попередня</button>
            <span id="pageInfo"></span>
            <button onclick="nextPage()" id="nextBtn">Наступна</button>
        </div>
    </div>

    <div id="eventModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Version: 1.3.0 - Client-side filtering and sorting, load all events
        // Визначаємо API base URL
        // Якщо сторінка відкрита через HTTP сервер, використовуємо локальний проксі
        // Інакше намагаємось звертатися напряму (може не працювати через CORS)
        const isLocalServer = window.location.protocol === 'http:' || window.location.protocol === 'https:';
        const API_BASE = isLocalServer ? '/api' : 'https://gamma-api.polymarket.com';

        let currentPage = 0;
        let currentLimit = 12;
        let allEvents = [];
        let filteredEvents = [];

        // Функція для екранування HTML спецсимволів
        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Функції для роботи з цінами та ліквідністю =====

        // Завантажити ціну для token
        async function loadPrice(tokenId, side = 'BUY') {
            try {
                const response = await fetch(`${API_BASE}/price?token_id=${tokenId}&side=${side}`);
                if (!response.ok) throw new Error('Failed to fetch price');
                return await response.json();
            } catch (error) {
                console.error(`Error loading price for ${tokenId}:`, error);
                return null;
            }
        }

        // Завантажити середню ціну (midpoint)
        async function loadMidpoint(tokenId) {
            try {
                const response = await fetch(`${API_BASE}/midpoint?token_id=${tokenId}`);
                if (!response.ok) throw new Error('Failed to fetch midpoint');
                return await response.json();
            } catch (error) {
                console.error(`Error loading midpoint for ${tokenId}:`, error);
                return null;
            }
        }

        // Завантажити order book
        async function loadOrderBook(tokenId) {
            try {
                const response = await fetch(`${API_BASE}/book?token_id=${tokenId}`);
                if (!response.ok) throw new Error('Failed to fetch order book');
                return await response.json();
            } catch (error) {
                console.error(`Error loading order book for ${tokenId}:`, error);
                return null;
            }
        }

        // Створити HTML для відображення ціни з progress bar
        function createPriceDisplay(outcomeName, probability) {
            const percentage = (probability * 100).toFixed(1);
            return `
                <div class="price-indicator">
                    <div style="min-width: 100px; font-weight: 500;">${escapeHtml(outcomeName)}:</div>
                    <div class="price-bar">
                        <div class="price-fill" style="width: ${percentage}%">
                            <span class="price-percentage">${percentage}%</span>
                        </div>
                    </div>
                    <div class="price-value">$${probability.toFixed(3)}</div>
                </div>
            `;
        }

        // Розрахувати ліквідність на основі order book
        function calculateLiquidity(orderBook) {
            if (!orderBook || !orderBook.bids || !orderBook.asks) {
                return { level: 'unknown', totalVolume: 0 };
            }

            const bidsVolume = orderBook.bids.reduce((sum, bid) => sum + parseFloat(bid.size || 0), 0);
            const asksVolume = orderBook.asks.reduce((sum, ask) => sum + parseFloat(ask.size || 0), 0);
            const totalVolume = bidsVolume + asksVolume;

            let level = 'low';
            if (totalVolume > 10000) level = 'high';
            else if (totalVolume > 1000) level = 'medium';

            return { level, totalVolume, bidsVolume, asksVolume };
        }

        // Створити HTML для індикатора ліквідності
        function createLiquidityIndicator(liquidity) {
            const labels = {
                high: 'Висока ліквідність',
                medium: 'Середня ліквідність',
                low: 'Низька ліквідність',
                unknown: 'Ліквідність невідома'
            };

            const icons = {
                high: '💎',
                medium: '💧',
                low: '⚠️',
                unknown: '❓'
            };

            return `
                <span class="liquidity-indicator liquidity-${liquidity.level}">
                    ${icons[liquidity.level]} ${labels[liquidity.level]}
                    ${liquidity.totalVolume > 0 ? ` ($${liquidity.totalVolume.toFixed(0)})` : ''}
                </span>
            `;
        }

        // Створити HTML для order book
        function createOrderBookDisplay(orderBook) {
            if (!orderBook || !orderBook.bids || !orderBook.asks) {
                return '<div class="price-error">Order book недоступний</div>';
            }

            const bids = orderBook.bids.slice(0, 5); // Топ 5 bid ордерів
            const asks = orderBook.asks.slice(0, 5); // Топ 5 ask ордерів

            return `
                <div class="orderbook">
                    <div class="orderbook-side orderbook-bids">
                        <div class="orderbook-side-title">Купівля (Bids)</div>
                        <div class="orderbook-header">
                            <div>Ціна</div>
                            <div class="orderbook-header-size">Об'єм</div>
                        </div>
                        <div class="orderbook-rows">
                            ${bids.length > 0 ? bids.map(bid => `
                                <div class="orderbook-row">
                                    <div class="orderbook-price">$${parseFloat(bid.price).toFixed(3)}</div>
                                    <div class="orderbook-size">${parseFloat(bid.size).toFixed(0)}</div>
                                </div>
                            `).join('') : '<div style="padding: 10px; text-align: center; color: #999;">Немає ордерів</div>'}
                        </div>
                    </div>
                    <div class="orderbook-side orderbook-asks">
                        <div class="orderbook-side-title">Продаж (Asks)</div>
                        <div class="orderbook-header">
                            <div>Ціна</div>
                            <div class="orderbook-header-size">Об'єм</div>
                        </div>
                        <div class="orderbook-rows">
                            ${asks.length > 0 ? asks.map(ask => `
                                <div class="orderbook-row">
                                    <div class="orderbook-price">$${parseFloat(ask.price).toFixed(3)}</div>
                                    <div class="orderbook-size">${parseFloat(ask.size).toFixed(0)}</div>
                                </div>
                            `).join('') : '<div style="padding: 10px; text-align: center; color: #999;">Немає ордерів</div>'}
                        </div>
                    </div>
                </div>
            `;
        }

        // Перевірка чи сторінка відкрита правильно
        function checkServerStatus() {
            if (!isLocalServer) {
                showError('⚠️ УВАГА: Ви відкрили файл безпосередньо (file://). Це НЕ БУДЕ працювати через CORS обмеження браузера.\n\n' +
                    'Будь ласка, запустіть локальний сервер:\n\n' +
                    'Варіант 1 (Python):\n' +
                    '  pip install -r requirements.txt\n' +
                    '  python proxy-server.py\n\n' +
                    'Варіант 2 (Node.js):\n' +
                    '  npm install\n' +
                    '  npm start\n\n' +
                    'Потім відкрийте http://localhost:5000 у браузері.');
                return false;
            }
            return true;
        }

        async function loadEvents() {
            // Перевірка чи сервер запущений
            if (!checkServerStatus()) {
                showLoading(false);
                return;
            }

            currentPage = 0;
            showLoading(true);
            hideError();

            try {
                // Завантажуємо ВСІ події без фільтрів (максимальний ліміт)
                // Фільтрацію та сортування робимо на клієнті
                const params = new URLSearchParams({
                    limit: 1000,  // Завантажуємо максимальну кількість
                    offset: 0,
                    order: 'id',
                    ascending: false,
                    archived: false
                });

                const response = await fetch(`${API_BASE}/events?${params}`);

                if (!response.ok) {
                    throw new Error(`Помилка API: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                allEvents = data || [];

                // Застосовуємо фільтри та сортування на клієнті
                applyFiltersAndSort();

            } catch (error) {
                showError(`Помилка завантаження: ${error.message}`);
                console.error('Error:', error);
            } finally {
                showLoading(false);
            }
        }

        // Застосувати фільтри та сортування на клієнті
        function applyFiltersAndSort() {
            const statusFilter = document.getElementById('statusFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;
            const limit = document.getElementById('limitSelect').value;

            currentLimit = parseInt(limit);
            currentPage = 0;

            // Фільтрація
            if (statusFilter === 'active') {
                filteredEvents = allEvents.filter(event => !event.closed && event.active);
            } else if (statusFilter === 'closed') {
                filteredEvents = allEvents.filter(event => event.closed);
            } else {
                filteredEvents = [...allEvents]; // Всі події
            }

            // Сортування за датою створення або ID
            filteredEvents.sort((a, b) => {
                const idA = parseInt(a.id) || 0;
                const idB = parseInt(b.id) || 0;

                if (sortOrder === 'asc') {
                    return idA - idB; // Найстаріші спочатку
                } else {
                    return idB - idA; // Найновіші спочатку
                }
            });

            displayEvents();
            updateStats();
        }

        function displayEvents() {
            const container = document.getElementById('eventsContainer');

            if (filteredEvents.length === 0) {
                container.innerHTML = `
                    <div class="no-events">
                        <div class="no-events-icon">🔍</div>
                        <h2>Події не знайдено</h2>
                        <p>Спробуйте змінити фільтри або завантажити більше подій</p>
                    </div>
                `;
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            const startIndex = currentPage * currentLimit;
            const endIndex = Math.min(startIndex + currentLimit, filteredEvents.length);
            const eventsToDisplay = filteredEvents.slice(startIndex, endIndex);

            container.innerHTML = eventsToDisplay.map(event => createEventCard(event)).join('');
            updatePagination();
        }

        function createEventCard(event) {
            const markets = event.markets || [];
            const activeCount = markets.filter(m => m.active).length;
            const imageUrl = event.image || event.icon || '';
            const tags = event.tags || [];

            const statusClass = event.closed ? 'status-closed' : 'status-active';
            const statusText = event.closed ? 'Закрито' : 'Активно';

            return `
                <div class="event-card" onclick="showEventDetails('${escapeHtml(event.id)}')">
                    ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(event.title)}" class="event-image" onerror="this.style.display='none'">` : ''}

                    <div class="event-title">${escapeHtml(event.title || 'Без назви')}</div>

                    ${event.description ? `<div class="event-description">${escapeHtml(event.description)}</div>` : ''}

                    <div class="event-meta">
                        <div class="meta-item">
                            <span class="meta-label">Ринків:</span>
                            <span class="meta-value">${markets.length}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Активних:</span>
                            <span class="meta-value">${activeCount}</span>
                        </div>
                        <div class="meta-item">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    </div>

                    ${tags.length > 0 ? `
                        <div class="tags">
                            ${tags.slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag.label || tag)}</span>`).join('')}
                        </div>
                    ` : ''}

                    ${markets.length > 0 ? `
                        <div class="market-info">
                            <div class="market-count">Доступні ринки:</div>
                            <div class="markets-list">
                                ${markets.slice(0, 3).map(market => createMarketPreview(market)).join('')}
                                ${markets.length > 3 ? `<div style="text-align: center; color: #667eea; font-weight: 600;">+${markets.length - 3} ще...</div>` : ''}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function createMarketPreview(market) {
            // Забезпечуємо що outcomes є масивом
            let outcomes = market.outcomes || [];
            if (!Array.isArray(outcomes)) {
                // Якщо outcomes - об'єкт, спробуємо отримати значення
                if (typeof outcomes === 'object' && outcomes !== null) {
                    outcomes = Object.values(outcomes);
                } else {
                    outcomes = [];
                }
            }

            const groupItemTitle = market.groupItemTitle || market.question || 'Без питання';

            return `
                <div class="market-item">
                    <div class="market-question">${escapeHtml(groupItemTitle)}</div>
                    ${outcomes.length > 0 ? `
                        <div class="market-outcomes">
                            ${outcomes.map(outcome => {
                                const outcomeName = typeof outcome === 'string' ? outcome : (outcome.name || outcome.title || JSON.stringify(outcome));
                                return `
                                    <div class="outcome">
                                        <span class="outcome-name">${escapeHtml(outcomeName)}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function showEventDetails(eventId) {
            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;

            const modal = document.getElementById('eventModal');
            const modalContent = document.getElementById('modalContent');

            const markets = event.markets || [];
            const tags = event.tags || [];
            const imageUrl = event.image || event.icon || '';

            modalContent.innerHTML = `
                ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(event.title)}" class="modal-image" onerror="this.style.display='none'">` : ''}

                <h2 style="color: #667eea; margin-bottom: 15px;">${escapeHtml(event.title || 'Без назви')}</h2>

                ${event.description ? `<p style="color: #666; line-height: 1.6; margin-bottom: 20px;">${escapeHtml(event.description)}</p>` : ''}

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                        <div style="color: #999; font-size: 0.9em;">Статус</div>
                        <div style="font-weight: 600; color: #333;">${event.closed ? 'Закрито' : 'Активно'}</div>
                    </div>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                        <div style="color: #999; font-size: 0.9em;">Ринків</div>
                        <div style="font-weight: 600; color: #667eea;">${markets.length}</div>
                    </div>
                    ${event.startDate ? `
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                            <div style="color: #999; font-size: 0.9em;">Дата початку</div>
                            <div style="font-weight: 600; color: #333;">${new Date(event.startDate).toLocaleDateString('uk-UA')}</div>
                        </div>
                    ` : ''}
                    ${event.endDate ? `
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                            <div style="color: #999; font-size: 0.9em;">Дата закінчення</div>
                            <div style="font-weight: 600; color: #333;">${new Date(event.endDate).toLocaleDateString('uk-UA')}</div>
                        </div>
                    ` : ''}
                </div>

                ${tags.length > 0 ? `
                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 10px;">Теги:</h3>
                        <div class="tags">
                            ${tags.map(tag => `<span class="tag">${escapeHtml(tag.label || tag)}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}

                ${markets.length > 0 ? `
                    <div>
                        <h3 style="margin-bottom: 15px;">Всі ринки (${markets.length}):</h3>
                        <div style="display: flex; flex-direction: column; gap: 15px;">
                            ${markets.map((market, index) => createMarketDetail(market, index)).join('')}
                        </div>
                    </div>
                ` : ''}

                ${event.slug ? `
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0;">
                        <a href="https://polymarket.com/event/${escapeHtml(event.slug)}" target="_blank"
                           style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                                  color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none;
                                  font-weight: 600; transition: transform 0.2s;"
                           onmouseover="this.style.transform='translateY(-2px)'"
                           onmouseout="this.style.transform='translateY(0)'">
                            Переглянути на Polymarket ↗
                        </a>
                    </div>
                ` : ''}
            `;

            modal.style.display = 'block';
        }

        function createMarketDetail(market, marketIndex) {
            // Забезпечуємо що outcomes є масивом
            let outcomes = market.outcomes || [];
            if (!Array.isArray(outcomes)) {
                if (typeof outcomes === 'string') {
                    // Спроба парсити як JSON якщо це JSON строка
                    try {
                        const parsed = JSON.parse(outcomes);
                        outcomes = Array.isArray(parsed) ? parsed : [outcomes];
                    } catch {
                        outcomes = [outcomes];
                    }
                } else if (typeof outcomes === 'object' && outcomes !== null) {
                    outcomes = Object.values(outcomes);
                } else {
                    outcomes = [];
                }
            }

            const groupItemTitle = market.groupItemTitle || market.question || 'Без питання';

            // Забезпечуємо що clobTokenIds є масивом
            let clobTokenIds = market.clobTokenIds || [];
            if (!Array.isArray(clobTokenIds)) {
                if (typeof clobTokenIds === 'string') {
                    // Спроба парсити як JSON якщо це JSON строка
                    try {
                        const parsed = JSON.parse(clobTokenIds);
                        clobTokenIds = Array.isArray(parsed) ? parsed : [clobTokenIds];
                    } catch {
                        // Якщо не JSON, просто обгортаємо в масив
                        clobTokenIds = [clobTokenIds];
                    }
                } else if (typeof clobTokenIds === 'object' && clobTokenIds !== null) {
                    clobTokenIds = Object.values(clobTokenIds);
                } else {
                    clobTokenIds = [];
                }
            }

            const marketId = market.id || marketIndex;

            // Базовий HTML ринку
            let html = `
                <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #667eea;" id="market-${marketId}">
                    <div style="font-weight: 600; color: #333; margin-bottom: 10px;">${escapeHtml(groupItemTitle)}</div>

                    ${market.description ? `<div style="color: #666; font-size: 0.9em; margin-bottom: 10px;">${escapeHtml(market.description)}</div>` : ''}

                    <div style="margin-top: 10px; font-size: 0.85em; color: #999;">
                        Статус: ${market.active ? '✅ Активний' : '❌ Неактивний'}
                        ${market.closed ? ' | Закритий' : ''}
                    </div>
            `;

            // Якщо є token IDs, показуємо ціни
            if (clobTokenIds.length > 0) {
                html += `
                    <div id="prices-${marketId}" style="margin-top: 15px;">
                        <div class="loading-prices">⏳ Завантаження цін...</div>
                    </div>
                    <div id="orderbook-${marketId}" style="margin-top: 10px;"></div>
                `;

                // Асинхронно завантажуємо ціни
                setTimeout(() => loadMarketPrices(market, marketId), 100);
            } else {
                // Показуємо outcomes як раніше
                if (outcomes.length > 0) {
                    html += `
                        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                            ${outcomes.map(outcome => {
                                const outcomeName = typeof outcome === 'string' ? outcome : (outcome.name || outcome.title || JSON.stringify(outcome));
                                return `
                                    <div style="background: white; padding: 8px 15px; border-radius: 5px; font-weight: 500;">
                                        ${escapeHtml(outcomeName)}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }
            }

            html += `</div>`;
            return html;
        }

        // Завантажити ціни для ринку
        async function loadMarketPrices(market, marketId) {
            const pricesContainer = document.getElementById(`prices-${marketId}`);
            const orderbookContainer = document.getElementById(`orderbook-${marketId}`);

            if (!pricesContainer) return;

            try {
                // Забезпечуємо що clobTokenIds є масивом
                let clobTokenIds = market.clobTokenIds || [];
                if (!Array.isArray(clobTokenIds)) {
                    if (typeof clobTokenIds === 'string') {
                        // Спроба парсити як JSON якщо це JSON строка
                        try {
                            const parsed = JSON.parse(clobTokenIds);
                            clobTokenIds = Array.isArray(parsed) ? parsed : [clobTokenIds];
                        } catch {
                            // Якщо не JSON, просто обгортаємо в масив
                            clobTokenIds = [clobTokenIds];
                        }
                    } else if (typeof clobTokenIds === 'object' && clobTokenIds !== null) {
                        clobTokenIds = Object.values(clobTokenIds);
                    } else {
                        clobTokenIds = [];
                    }
                }

                // Забезпечуємо що outcomes є масивом
                let outcomes = market.outcomes || [];
                if (!Array.isArray(outcomes)) {
                    if (typeof outcomes === 'string') {
                        // Спроба парсити як JSON якщо це JSON строка
                        try {
                            const parsed = JSON.parse(outcomes);
                            outcomes = Array.isArray(parsed) ? parsed : [outcomes];
                        } catch {
                            outcomes = [outcomes];
                        }
                    } else if (typeof outcomes === 'object' && outcomes !== null) {
                        outcomes = Object.values(outcomes);
                    } else {
                        outcomes = [];
                    }
                }

                if (clobTokenIds.length === 0) {
                    pricesContainer.innerHTML = '<div class="price-error">Token IDs недоступні</div>';
                    return;
                }

                // Завантажуємо midpoint для кожного outcome
                const pricePromises = clobTokenIds.map(tokenId => loadMidpoint(tokenId));
                const prices = await Promise.all(pricePromises);

                // Відображаємо ціни
                let pricesHtml = '<div style="margin-bottom: 10px;">';
                prices.forEach((priceData, index) => {
                    if (priceData && priceData.mid) {
                        const outcomeName = outcomes[index] || `Outcome ${index + 1}`;
                        const probability = parseFloat(priceData.mid);
                        pricesHtml += createPriceDisplay(outcomeName, probability);
                    }
                });
                pricesHtml += '</div>';

                pricesContainer.innerHTML = pricesHtml;

                // Завантажуємо order book для першого token (основний ринок)
                if (clobTokenIds.length > 0) {
                    const orderBook = await loadOrderBook(clobTokenIds[0]);
                    if (orderBook) {
                        const liquidity = calculateLiquidity(orderBook);
                        orderbookContainer.innerHTML = `
                            <div class="orderbook-container">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                    <div class="orderbook-title">Стакан цін</div>
                                    ${createLiquidityIndicator(liquidity)}
                                </div>
                                ${createOrderBookDisplay(orderBook)}
                            </div>
                        `;
                    }
                }

            } catch (error) {
                console.error('Error loading market prices:', error);
                pricesContainer.innerHTML = '<div class="price-error">Помилка завантаження цін</div>';
            }
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('eventModal').style.display = 'none';
        }

        function updateStats() {
            const totalEvents = allEvents.length;
            const activeEvents = allEvents.filter(e => !e.closed && e.active).length;
            const totalMarkets = allEvents.reduce((sum, e) => sum + (e.markets?.length || 0), 0);
            const filtered = filteredEvents.length;

            document.getElementById('totalEvents').textContent = totalEvents;
            document.getElementById('filteredEvents').textContent = filtered;
            document.getElementById('activeEvents').textContent = activeEvents;
            document.getElementById('totalMarkets').textContent = totalMarkets;
            document.getElementById('stats').style.display = 'grid';
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredEvents.length / currentLimit);
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';
            pageInfo.textContent = `Сторінка ${currentPage + 1} з ${totalPages}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredEvents.length / currentLimit);
            if (currentPage < totalPages - 1) {
                currentPage++;
                displayEvents();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                displayEvents();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function refreshEvents() {
            loadEvents();
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('loadBtn').disabled = show;
            document.getElementById('refreshBtn').disabled = show;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = message.replace(/\n/g, '<br>');
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // Автоматичне завантаження при відкритті сторінки
        window.addEventListener('load', () => {
            loadEvents();
        });

        // Закриття модального вікна при натисканні Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
